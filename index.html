<script>
/* ===== i18n for UI ===== */
const T={ua:{title:"Міст і політичні координати",intro:"Мене задовбало, що всі тести на політичні координати гівно, тому я вирішив зробити свої багатовимірні з Блекджеком і шлюхами!",start:"Розпочати опитування",back:"Назад",q:"Питання",res:"Ваш результат",ideo:"Ідеологія",axes:"Ваші координати",top:"Найближчі діячі",low:"Найменш схожі",plot:"Графік",all:"Усі",share:"Копіювати посилання",dl:"Завантажити JSON",copied:"Скопійовано",again:"Пройти знову",you:"Ви",strong:"Найвиразніші осі",match:"збіг"},
en:{title:"Bridge and Political Coordinates",intro:"I'm sick of every political-coordinates test being crap, so I decided to make my own multidimensional one, with blackjack and hookers!",start:"Start the survey",back:"Back",q:"Question",res:"Your result",ideo:"Ideology",axes:"Your coordinates",top:"Closest figures",low:"Least similar",plot:"Plot",all:"All",share:"Copy link",dl:"Download JSON",copied:"Copied",again:"Retake",you:"You",strong:"Most pronounced axes",match:"match"}};
/* ===== Axes: [neg pole, pos pole] each [ua,en] ===== */
const AX=[[["Планова економіка","Planned economy"],["Вільний ринок","Free market"]],
[["Авторитаризм","Authoritarianism"],["Лібертаріанство","Libertarianism"]],
[["Традиціоналізм","Traditionalism"],["Прогресивізм","Progressivism"]],
[["Індивідуалізм","Individualism"],["Комунітаризм","Communitarianism"]],
[["Глобалізм","Globalism"],["Націоналізм/суверенізм","Nationalism/sovereigntism"]],
[["Унітаризм","Unitarism"],["Федералізм/децентралізація","Federalism/decentralization"]],
[["Антропоцентризм","Anthropocentrism"],["Екоцентризм","Ecocentrism"]],
[["Ідеалізм/пацифізм","Idealism/pacifism"],["Реалізм/мілітаризм","Realism/militarism"]]];
/* ===== Questions: a=axis index; o=[ua,en,value -100..100] — extend by pushing objects ===== */
const Q=[
{a:0,q:["Яку роль має відігравати держава в розподілі ресурсів?","What role should the state play in allocating resources?"],o:[
["Центральне планування, бо воно усуває кризи надвиробництва й координує цілі суспільства.","Central planning, since it removes overproduction crises and coordinates societal goals.",-85],
["Змішана економіка: ринок для ефективності, держава для перерозподілу та громадських благ.","A mixed economy: markets for efficiency, the state for redistribution and public goods.",-30],
["Ринок із чіткими правилами, бо конкуренція потребує арбітра проти монополій.","Markets under clear rules, since competition needs a referee against monopolies.",35],
["Мінімальна держава, бо ціни передають знання, яких не має жоден планувальник.","A minimal state, since prices carry knowledge no planner possesses.",85]]},
{a:1,q:["Як співвідносяться безпека й особиста свобода?","How do security and personal liberty relate?"],o:[
["Сильна влада потрібна для порядку; свободи другорядні щодо стабільності.","Strong authority secures order; liberties are secondary to stability.",-85],
["Обмеження свобод припустимі в кризу за чітких часових меж.","Limits on liberty are acceptable in crises with clear time limits.",-30],
["Свободи за замовчуванням, обмеження лише для запобігання шкоді іншим.","Liberty by default, restricted only to prevent harm to others.",40],
["Примус нелегітимний за принципом, добровільні угоди достатні для порядку.","Coercion is illegitimate in principle; voluntary arrangements suffice for order.",90]]},
{a:2,q:["Як ставитися до зміни соціальних норм?","How should societies approach changing social norms?"],o:[
["Традиції накопичують досвід поколінь, зміни мають бути мінімальними.","Traditions hold generations of experience; change should be minimal.",-85],
["Реформи можливі, але поступові та з огляду на наслідки.","Reform is fine if gradual and mindful of consequences.",-30],
["Норми слід переглядати, коли вони обмежують рівні можливості.","Norms should be revised when they limit equal opportunity.",35],
["Активне оновлення норм на основі прав людини й нових знань.","Active renewal of norms grounded in human rights and new knowledge.",85]]},
{a:3,q:["Що первинне: інтереси особи чи спільноти?","What takes priority: individual or community interests?"],o:[
["Особа, бо лише індивіди мають досвід і відповідальність.","The individual, since only individuals experience and bear responsibility.",-85],
["Особа, але зі зобов'язаннями перед громадянським суспільством.","The individual, with obligations toward civil society.",-30],
["Баланс: спільні блага часто важливі для розвитку особи.","Balance: shared goods are often prerequisites for personal flourishing.",30],
["Спільнота, бо ідентичність і сенс формуються в колективі.","The community, since identity and meaning form collectively.",85]]},
{a:4,q:["Як поділити повноваження між державою та міжнародними інституціями?","How to divide authority between states and international bodies?"],o:[
["Глобальні проблеми потребують наддержавного врядування.","Global problems require supranational governance.",-85],
["Тісна співпраця з делегуванням окремих повноважень.","Close cooperation with limited delegated powers.",-30],
["Рішення ухвалюють держави; угоди добровільні та відкличні.","States decide; agreements are voluntary and revocable.",35],
["Національний суверенітет є основою демократичної підзвітності.","National sovereignty underpins democratic accountability.",85]]},
{a:5,q:["Який територіальний устрій найкращий?","Which territorial arrangement works best?"],o:[
["Єдина централізована система, що гарантує однакові стандарти.","A unified centralized system guaranteeing uniform standards.",-85],
["Унітарна держава з сильним місцевим самоврядуванням.","A unitary state with strong local self-government.",-25],
["Федерація з чітким розподілом компетенцій.","A federation with clearly divided competences.",40],
["Максимальна децентралізація аж до конфедерації громад.","Maximal decentralization up to a confederation of communities.",85]]},
{a:6,q:["Як поєднувати економічне зростання й довкілля?","How to reconcile growth with the environment?"],o:[
["Технології та зростання розв'язують екологічні проблеми.","Technology and growth solve environmental problems.",-85],
["Зростання з ринковими інструментами (податки, квоти).","Growth with market tools such as taxes and quotas.",-25],
["Сталий розвиток: економічні рішення в межах екологічних обмежень.","Sustainable development: economic choices within ecological limits.",40],
["Природа має самостійну цінність; потрібне обмеження споживання.","Nature has intrinsic value; consumption must be limited.",85]]},
{a:7,q:["Як діяти у міжнародній політиці?","How should states act internationally?"],o:[
["Право, дипломатія й роззброєння понад силу.","Law, diplomacy and disarmament over force.",-85],
["Переважно мирні засоби, сила лише як крайній захід.","Mostly peaceful means, force as a last resort.",-30],
["Держави керуються інтересами; потрібні сильна оборона та союзи.","States follow interests; strong defense and alliances are needed.",40],
["Безпека залежить від військової переваги й стримування.","Security rests on military superiority and deterrence.",85]]},
{a:0,q:["Що має визначати оплату праці?","What should determine pay?"],o:[["Потреби людей, а не ринковий попит.","People's needs rather than market demand.",-85],["Колективні угоди та суспільні норми гідної оплати.","Collective agreements and social norms of decent pay.",-30],["Ринок, але з мінімальним захистом.","The market, with a minimal safety floor.",35],["Вільна домовленість сторін без втручання.","Free agreement between parties without interference.",85]]},
{a:1,q:["Яким має бути контроль держави за інформацією?","How far should the state control information?"],o:[["Широкий контроль заради єдності та безпеки.","Broad control for unity and security.",-85],["Обмеження лише щодо загроз безпеці за судовим рішенням.","Limits only for security threats with judicial approval.",-20],["Мінімальні обмеження, прозорість влади.","Minimal limits and transparent government.",40],["Жодної цензури та приватність без винятків.","No censorship and privacy without exceptions.",90]]},
{a:2,q:["Яким має бути підхід школи до виховання цінностей?","How should schools approach values education?"],o:[["Передавати усталені моральні та релігійні традиції.","Pass on established moral and religious traditions.",-85],["Поєднувати традиційні цінності з критичним мисленням.","Combine traditional values with critical thinking.",-25],["Навчати плюралізму та критично оцінювати традиції.","Teach pluralism and critical assessment of traditions.",40],["Орієнтуватися на інклюзію та сучасні дослідження.","Focus on inclusion and current research.",85]]},
{a:3,q:["Хто має підтримувати вразливих людей?","Who should support the vulnerable?"],o:[["Сім'я та особисті вибори кожного.","Family and each person's own choices.",-85],["Приватна благодійність і добровільні об'єднання.","Private charity and voluntary associations.",-30],["Місцеві громади та взаємодопомога.","Local communities and mutual aid.",35],["Суспільство через обов'язкову солідарну систему.","Society through a mandatory solidarity system.",85]]},
{a:4,q:["Як ставитися до міграції?","How to approach migration?"],o:[["Відкриті кордони сприяють свободі й розвитку.","Open borders support freedom and development.",-85],["Гнучка політика за потребами ринку праці.","Flexible policy guided by labor-market needs.",-25],["Контроль потоків та вимоги до інтеграції.","Controlled flows with integration requirements.",40],["Суворі обмеження для збереження ідентичності.","Strict limits to preserve national identity.",85]]},
{a:5,q:["Хто має збирати й розподіляти податки?","Who should collect and spend taxes?"],o:[["Центр, для вирівнювання регіонів.","The center, to equalize regions.",-85],["Переважно центр із місцевою часткою.","Mainly the center with a local share.",-25],["Регіони й громади залишають більшість доходів.","Regions and communities keep most revenue.",40],["Місцеві громади; центр фінансується ними.","Local communities; the center is funded by them.",85]]},
{a:6,q:["Як ставитися до тварин і екосистем?","How to treat animals and ecosystems?"],o:[["Вони є ресурсом для людських потреб.","They are resources for human needs.",-85],["Охороняти заради користі для людей.","Protect them for their benefits to humans.",-25],["Охороняти і за власну цінність, і за користь.","Protect them for both intrinsic and instrumental value.",40],["Мають права, що обмежують господарську діяльність.","They hold rights that limit economic activity.",85]]},
{a:7,q:["Як діяти, коли сусід загрожує безпеці?","How to act when a neighbor threatens security?"],o:[["Переговори й міжнародні гарантії без сили.","Negotiation and international guarantees without force.",-85],["Санкції та дипломатія, оборона лише як крайній захід.","Sanctions and diplomacy, defense only as a last resort.",-25],["Сильна армія та союзи для стримування.","A strong army and alliances for deterrence.",45],["Превентивні заходи й максимальна військова готовність.","Preventive measures and maximal military readiness.",85]]},
{a:0,q:["Кому мають належати ключові інфраструктура й ресурси?","Who should own key infrastructure and resources?"],o:[["Державі, бо вони забезпечують загальне благо.","The state, since they serve the common good.",-85],["Державі або громадам, але з незалежним управлінням.","The state or communities under independent management.",-30],["Приватним власникам під регуляторним наглядом.","Private owners under regulatory oversight.",35],["Приватним власникам; регулювання лише шкодить ефективності.","Private owners; regulation mainly harms efficiency.",85]]},
{a:1,q:["Як слід обмежувати владу?","How should government power be limited?"],o:[["Сильна виконавча влада з мінімумом стримувань.","A strong executive with minimal checks.",-85],["Незалежні вибори й суди, але сильна виконавча гілка.","Independent elections and courts, with a strong executive.",-25],["Розподіл гілок і конституційні гарантії прав.","Separation of powers and constitutional rights guarantees.",40],["Радикальне звуження повноважень держави до мінімуму.","Radical reduction of state powers to a minimum.",90]]},
{a:2,q:["Як ставитися до змін у ролях сім'ї та суспільства?","How to view changing family and social roles?"],o:[["Усталені ролі підтримують стабільність суспільства.","Established roles support social stability.",-85],["Зміни прийнятні, якщо не руйнують інститут сім'ї.","Change is fine if it does not undermine the family institution.",-25],["Люди мають вільно обирати моделі життя.","People should freely choose their way of life.",45],["Традиційні ролі слід активно переглядати заради рівності.","Traditional roles should be actively revised for equality.",85]]},
{a:3,q:["Який обов'язок людина має перед спільнотою?","What duty does a person owe the community?"],o:[["Лише ті, що вона добровільно прийняла.","Only those she voluntarily accepted.",-85],["Сплата податків і дотримання законів.","Paying taxes and obeying laws.",-25],["Участь у громадському житті й взаємодопомога.","Civic participation and mutual aid.",35],["Служіння спільному благу, навіть коштом особистих інтересів.","Service to the common good, even at personal cost.",85]]},
{a:4,q:["Яку роль мають міжнародні суди й норми?","What role should international courts and norms play?"],o:[["Обов'язкову: їхні рішення стоять над національними.","Binding: their rulings outrank national ones.",-85],["Значну, з можливістю національних застережень.","Significant, with room for national reservations.",-25],["Дорадчу: держава сама визначає, що виконувати.","Advisory: each state decides what to comply with.",40],["Мінімальну: вони обмежують демократичний суверенітет.","Minimal: they constrain democratic sovereignty.",85]]},
{a:5,q:["Як вирішувати суперечки між центром і регіонами?","How to settle disputes between center and regions?"],o:[["Рішення центру остаточне для єдності держави.","The center's decision is final for state unity.",-85],["Центр вирішує, але після консультацій з регіонами.","The center decides after consulting regions.",-25],["Конституційний суд між рівними рівнями влади.","A constitutional court between equal levels of government.",40],["Регіони можуть блокувати рішення або виходити зі складу.","Regions may veto decisions or withdraw.",85]]},
{a:6,q:["Яку ціну суспільство має платити за кліматичну політику?","What cost should society accept for climate policy?"],o:[["Невелику: адаптація й технології дешевші за обмеження.","A small one: adaptation and technology beat restrictions.",-85],["Помірну, переважно через ринкові механізми.","A moderate one, mainly via market mechanisms.",-20],["Значну: перехід на низьковуглецеву економіку.","A substantial one: transition to a low-carbon economy.",45],["Високу, включно зі скороченням споживання.","A high one, including reduced consumption.",85]]},
{a:7,q:["Яким має бути пріоритет оборонних витрат?","What priority should defense spending have?"],o:[["Мінімальним: ресурси краще спрямувати на розвиток.","Minimal: resources are better spent on development.",-85],["Помірним, достатнім для оборони.","Moderate, sufficient for defense.",-20],["Високим: слабка оборона провокує агресію.","High: weak defense invites aggression.",45],["Пріоритетним, з розвитком оборонної промисловості.","A top priority, with a developed defense industry.",85]]},
{a:0,q:["Як ставитися до податків на капітал і спадщину?","How to approach taxes on capital and inheritance?"],o:[["Високі прогресивні ставки для зменшення нерівності.","High progressive rates to reduce inequality.",-85],["Помірні ставки з упором на соціальні програми.","Moderate rates funding social programs.",-25],["Низькі ставки, щоб не стримувати інвестиції.","Low rates so as not to deter investment.",40],["Скасувати: майно вже оподатковане при створенні.","Abolish: property was already taxed when created.",85]]},
{a:1,q:["Як ставитися до масового стеження заради безпеки?","How to view mass surveillance for security?"],o:[["Широке стеження виправдане безпекою.","Broad surveillance is justified by security.",-85],["Стеження з судовим дозволом і звітністю.","Surveillance with court approval and reporting.",-25],["Лише за конкретною обґрунтованою підозрою.","Only on concrete, reasoned suspicion.",40],["Повна заборона масового стеження.","A full ban on mass surveillance.",90]]},
{a:2,q:["Яке місце має релігія в публічному житті?","What place should religion have in public life?"],o:[["Релігійні норми мають впливати на закони.","Religious norms should shape legislation.",-85],["Державна повага до традиційних конфесій поряд зі свободою совісті.","State respect for traditional faiths alongside freedom of conscience.",-25],["Світська держава з вільною практикою віри.","A secular state with free religious practice.",40],["Суворе відокремлення релігії від публічних інституцій.","Strict separation of religion from public institutions.",85]]},
{a:3,q:["Яким має бути пенсійне забезпечення?","How should pensions be organized?"],o:[["Особисті накопичення: кожен відповідає за себе.","Personal savings: each person is responsible for themselves.",-85],["Переважно накопичувальна система з мінімальною гарантією.","Mostly funded schemes with a minimal guarantee.",-25],["Змішана модель із державним та приватним рівнем.","A mixed public and private model.",35],["Солідарна: працюючі утримують пенсіонерів.","Solidarity-based: workers support retirees.",85]]},
{a:4,q:["Яку роль має відігравати мова й культура в освіті?","What role should national language and culture play in education?"],o:[["Багатомовна освіта з глобальними програмами.","Multilingual education with global curricula.",-85],["Державна мова плюс сильні іноземні мови.","The state language plus strong foreign languages.",-25],["Державна мова й національна історія в пріоритеті.","State language and national history as priorities.",40],["Освіта передусім формує національну ідентичність.","Education primarily shapes national identity.",85]]},
{a:5,q:["Як обирати керівників місцевої влади?","How should local leaders be chosen?"],o:[["Призначає центр.","Appointed by the center.",-85],["Центр затверджує кандидатів із місцевих.","The center approves candidates from the locality.",-25],["Прямі місцеві вибори.","Direct local elections.",40],["Місцеві вибори плюс референдуми та відкликання.","Local elections plus referendums and recall.",85]]},
{a:6,q:["Як ставитися до заповідних територій і видобутку ресурсів?","How to balance protected areas and resource extraction?"],o:[["Пріоритет видобутку й господарського розвитку.","Priority to extraction and economic development.",-85],["Видобуток дозволений із компенсаціями.","Extraction allowed with compensation.",-25],["Розширення заповідних зон.","Expanding protected areas.",40],["Захист значних територій від господарювання.","Shielding large areas from economic use.",85]]},
{a:7,q:["Яким має бути комплектування армії?","How should the armed forces be staffed?"],o:[["Відмовитися від армії на користь невійськових засобів.","Replace armies with non-military means.",-85],["Професійна армія на контракті.","A professional contract army.",-25],["Контракт плюс навчена резервна мобілізація.","Contract service plus a trained mobilization reserve.",45],["Загальна військова повинність.","Universal conscription.",85]]},
{a:0,q:["Як ставитися до мінімальної заробітної плати?","How to view a statutory minimum wage?"],o:[["Високий законодавчий мінімум і контроль цін.","A high statutory minimum with price controls.",-85],["Помірний загальний мінімум.","A moderate general minimum.",-25],["Мінімум за галузями чи регіонами за угодою сторін.","Sector or regional minimums set by agreement.",40],["Без законодавчого мінімуму.","No statutory minimum.",85]]},
{a:1,q:["Як співвідносяться свобода слова й заборона мови ворожнечі?","How do free speech and hate-speech bans relate?"],o:[["Держава визначає допустимі висловлювання.","The state defines permissible speech.",-85],["Широкі заборони з обмеженими виключеннями.","Broad bans with limited exceptions.",-25],["Заборона лише прямих закликів до насильства.","Ban only direct incitement to violence.",40],["Жодних юридичних обмежень на висловлювання.","No legal limits on speech.",90]]},
{a:2,q:["Як ставитися до генної інженерії та біотехнологій?","How to approach genetic engineering and biotechnology?"],o:[["Заборонити через етичні ризики.","Prohibit due to ethical risks.",-85],["Дозволити лише лікувальні застосування.","Allow therapeutic uses only.",-25],["Дозволити під незалежним наглядом.","Allow under independent oversight.",40],["Розвивати без суттєвих обмежень як науковий прогрес.","Develop with few limits as scientific progress.",85]]},
{a:3,q:["Як ухвалювати рішення у спільноті?","How should a community make decisions?"],o:[["Кожен діє за власним вибором.","Each person acts on their own choice.",-85],["Домовленості між зацікавленими сторонами.","Agreements among the interested parties.",-25],["Більшістю голосів з урахуванням меншин.","Majority vote with minority protections.",35],["Консенсусом заради спільної мети.","Consensus toward a shared goal.",85]]},
{a:4,q:["Як ставитися до спільного ринку й валюти?","How to view common markets and currencies?"],o:[["Повна інтеграція ринків і валют.","Full integration of markets and currencies.",-85],["Спільний ринок із національними валютами.","A common market with national currencies.",-25],["Двосторонні торговельні угоди.","Bilateral trade agreements.",40],["Захист національних виробників митами.","Protecting domestic producers with tariffs.",85]]},
{a:5,q:["Хто має утримувати школи й лікарні?","Who should run schools and hospitals?"],o:[["Центральний уряд за єдиними стандартами.","The central government under uniform standards.",-85],["Центр фінансує, регіони керують.","The center funds, regions manage.",-25],["Регіони та громади.","Regions and communities.",40],["Громади самі, за взаємними договорами.","Communities themselves, by mutual agreements.",85]]},
{a:6,q:["Як регулювати вирубку лісів?","How should logging be regulated?"],o:[["Власник вирішує сам.","The owner decides.",-85],["Лише мінімальні нормативи.","Minimal standards only.",-25],["Суворі ліміти та обов'язкове відновлення.","Strict limits and mandatory replanting.",40],["Заборона вирубки первинних лісів.","A ban on logging primary forests.",85]]},
{a:7,q:["Яку роль відіграє ядерне стримування?","What role should nuclear deterrence play?"],o:[["Одностороннє ядерне роззброєння.","Unilateral nuclear disarmament.",-85],["Багатостороннє роззброєння за гарантій.","Multilateral disarmament with guarantees.",-25],["Збереження наявного стримування.","Maintaining existing deterrence.",45],["Розбудова та модернізація арсеналів.","Expanding and modernizing arsenals.",85]]},
{a:0,q:["Як організувати систему охорони здоров'я?","How should healthcare be organized?"],o:[["Єдина державна система.","A single state system.",-85],["Обов'язкове державне страхування.","Mandatory public insurance.",-25],["Конкуренція страховиків із субсидіями.","Competing insurers with subsidies.",40],["Приватний ринок медичних послуг.","A private market for medical services.",85]]},
{a:1,q:["Які повноваження має мати поліція?","What powers should police have?"],o:[["Широкі повноваження для підтримання порядку.","Broad powers to maintain order.",-85],["Широкі, але з відомчим контролем.","Broad, with internal oversight.",-25],["Вузькі, під судовим контролем.","Narrow, under judicial control.",40],["Мінімальні; охорона переважно приватна чи громадська.","Minimal; protection mostly private or communal.",90]]},
{a:2,q:["Як ставитися до експериментів у мистецтві та культурі?","How to view experimentation in art and culture?"],o:[["Підтримувати класичні форми, обмежувати провокації.","Support classical forms, limit provocation.",-85],["Підтримувати традиційні форми з відкритістю.","Support traditional forms with openness.",-25],["Підтримувати різноманіття форм.","Support a diversity of forms.",40],["Заохочувати експерименти й перегляд канонів.","Encourage experiments and revision of canons.",85]]},
{a:3,q:["Яка роль профспілок і громадських об'єднань?","What role should unions and associations play?"],o:[["Мінімальна; договори укладаються індивідуально.","Minimal; contracts are individual.",-85],["Обмежена галузевими питаннями.","Limited to sectoral issues.",-25],["Значна у колективних угодах.","Significant in collective agreements.",35],["Центральна у керуванні підприємствами.","Central in managing enterprises.",85]]},
{a:4,q:["Як ставитися до іноземних інвестицій у стратегічні галузі?","How to treat foreign investment in strategic sectors?"],o:[["Відкриті без обмежень.","Open without restrictions.",-85],["Відкриті з базовими перевірками.","Open with basic screening.",-25],["Обмежені часткою власності.","Limited by ownership share.",40],["Заборонені задля суверенітету.","Prohibited for sovereignty.",85]]},
{a:5,q:["Чи можуть регіони ухвалювати власні закони?","May regions pass their own laws?"],o:[["Ні, закони єдині для всієї країни.","No, laws are uniform nationwide.",-85],["Лише технічні відмінності.","Only technical differences.",-25],["Так, у межах компетенції регіонів.","Yes, within regional competences.",40],["Так, разом із власним правосуддям.","Yes, including their own justice systems.",85]]},
{a:6,q:["Яке місце має відновлювана енергетика?","What place should renewable energy have?"],o:[["Другорядне; домінують традиційні джерела.","Secondary; conventional sources dominate.",-85],["Нарівні з традиційною за ринковою вартістю.","On par with conventional, by market cost.",-25],["Пріоритетне, зі зростанням частки.","A priority with a growing share.",40],["Повна відмова від викопного палива.","Full phase-out of fossil fuels.",85]]},
{a:7,q:["Як ставитися до військової допомоги союзникам?","How to approach military aid to allies?"],o:[["Утримуватися; лише гуманітарна допомога.","Abstain; humanitarian aid only.",-85],["Обмежена допомога через міжнародні структури.","Limited aid via international bodies.",-25],["Активна допомога союзникам заради власної безпеки.","Active aid to allies for one's own security.",45],["Військові блоки та прямі гарантії.","Military blocs and direct guarantees.",85]]},
{a:0,q:["Як ставитися до приватизації державних підприємств?","How to view privatization of state enterprises?"],o:[["Залишити в державній власності.","Keep them state-owned.",-85],["Приватизувати лише неключові.","Privatize only non-key ones.",-25],["Приватизувати більшість із регулюванням.","Privatize most, with regulation.",40],["Приватизувати все.","Privatize everything.",85]]},
{a:0,q:["Якими мають бути соціальні виплати?","What should social benefits look like?"],o:[["Універсальні та щедрі.","Universal and generous.",-85],["Адресні та помірні.","Targeted and moderate.",-25],["Тимчасові, лише за потреби.","Temporary, only when needed.",40],["Мінімальні або відсутні.","Minimal or absent.",85]]},
{a:1,q:["Як регулювати публічні зібрання?","How should public assemblies be regulated?"],o:[["Потрібен дозвіл, у якому можуть відмовити.","A permit is needed and may be denied.",-85],["Повідомлення й обмеження з причин безпеки.","Notification, with limits for safety.",-25],["Лише повідомлення.","Notification only.",40],["Без жодних обмежень.","No restrictions at all.",90]]},
{a:1,q:["Яким має бути обіг цивільної зброї?","How should civilian firearms be regulated?"],o:[["Заборона.","A ban.",-85],["Сувора ліцензія.","Strict licensing.",-25],["Ліцензія з простими вимогами.","Licensing with simple requirements.",40],["Вільний обіг.","Free circulation.",90]]},
{a:2,q:["Як ставитися до змін у мовних і правописних нормах?","How to view changes in language and spelling norms?"],o:[["Зберігати усталені норми.","Preserve established norms.",-85],["Змінювати рідко й обережно.","Change rarely and cautiously.",-25],["Відображати живу мову.","Reflect living usage.",40],["Активно оновлювати для інклюзії.","Update actively for inclusion.",85]]},
{a:2,q:["Якими мають бути публічні свята й символи?","What should public holidays and symbols be?"],o:[["Релігійні та історичні традиції.","Religious and historical traditions.",-85],["Збереження традицій з відкритістю.","Preserve traditions with openness.",-25],["Світські свята.","Secular holidays.",40],["Нейтральні та інклюзивні символи.","Neutral and inclusive symbols.",85]]},
{a:3,q:["Як вирішувати питання житла?","How should housing be provided?"],o:[["Приватна власність і ринок.","Private ownership and the market.",-85],["Ринок із субсидіями.","The market with subsidies.",-25],["Муніципальне житло.","Municipal housing.",35],["Кооперативи та спільна власність.","Cooperatives and common ownership.",85]]},
{a:4,q:["Як ставитися до подвійного громадянства?","How to view dual citizenship?"],o:[["Вільне.","Freely allowed.",-85],["Дозволене за умов.","Allowed with conditions.",-25],["Обмежене.","Restricted.",40],["Заборонене.","Prohibited.",85]]},
{a:5,q:["Яким має бути самоврядування національних меншин?","What self-government should national minorities have?"],o:[["Єдині правила без автономій.","Uniform rules without autonomies.",-85],["Культурні права в межах єдиної держави.","Cultural rights within a unified state.",-25],["Територіальна автономія.","Territorial autonomy.",40],["Широке самоврядування аж до конфедерації.","Broad self-rule up to confederation.",85]]},
{a:6,q:["Як поводитися з відходами?","How should waste be handled?"],o:[["Ринок сам знайде рішення.","The market will find solutions.",-85],["Заохочувати переробку.","Encourage recycling.",-25],["Обов'язкова переробка.","Mandatory recycling.",40],["Принцип нульових відходів.","A zero-waste principle.",85]]},
{a:7,q:["Яку роль має відігравати розвідка?","What role should intelligence services play?"],o:[["Мінімальну й прозору.","Minimal and transparent.",-85],["Обмежену парламентським контролем.","Limited by parliamentary oversight.",-25],["Сильну, щоб випереджати загрози.","Strong, to anticipate threats.",45],["Масштабну, з широкими повноваженнями.","Extensive, with broad powers.",85]]},
{a:0,q:["Як ставитися до базового доходу?","How to view a basic income?"],o:[["Універсальний базовий дохід для всіх.","A universal basic income for all.",-85],["Адресний мінімальний дохід.","A targeted minimum income.",-25],["Обмежена тимчасова допомога.","Limited temporary assistance.",40],["Без державних виплат.","No state payments.",85]]},
{a:1,q:["Як ставитися до анонімності в інтернеті?","How to view anonymity online?"],o:[["Заборонити анонімність.","Ban anonymity.",-85],["Ідентифікація для публічних акаунтів.","Identification for public accounts.",-25],["Анонімність з винятками.","Anonymity with exceptions.",40],["Повне право на анонімність.","A full right to anonymity.",90]]},
{a:1,q:["Як ставитися до державної ідентифікації громадян?","How to view state identification of citizens?"],o:[["Обов'язкова біометрична ідентифікація.","Mandatory biometric identification.",-85],["Обов'язкова ID-картка.","A mandatory ID card.",-25],["Добровільна ідентифікація.","Voluntary identification.",40],["Відмова від державної реєстрації.","No state registration.",90]]},
{a:2,q:["Як регулювати моральні норми в медіа?","How to regulate moral norms in media?"],o:[["Захист традиційної моралі через обмеження.","Protect traditional morality through restrictions.",-85],["Вікові рейтинги.","Age ratings.",-25],["Саморегулювання медіа.","Media self-regulation.",40],["Свобода творчості без моральних критеріїв.","Creative freedom without moral criteria.",85]]},
{a:3,q:["Хто має контролювати особисті дані?","Who should control personal data?"],o:[["Дані належать лише особі.","Data belongs solely to the person.",-85],["Особа з державним захистом.","The person, with state protection.",-25],["Спільні дані громади.","Shared community data.",35],["Суспільні дані для спільного блага.","Public data for the common good.",85]]},
{a:3,q:["Хто має першим вирішувати про освіту дитини?","Who should decide first about a child's education?"],o:[["Родина.","The family.",-85],["Родина зі державними стандартами.","The family within state standards.",-25],["Громада.","The community.",35],["Державні заклади та єдина програма.","State schools and a single curriculum.",85]]},
{a:4,q:["Які мови мають бути у публічному просторі?","Which languages should be used in public space?"],o:[["Будь-які, за вибором людей.","Any, by people's choice.",-85],["Державна та місцеві мови.","The state and local languages.",-25],["Державна мова в публічній сфері.","The state language in the public sphere.",40],["Лише державна мова.","Only the state language.",85]]},
{a:5,q:["Як формувати верхню палату парламенту?","How to form an upper chamber of parliament?"],o:[["Без верхньої палати.","No upper chamber.",-85],["Призначається центром.","Appointed by the center.",-25],["Представники регіонів.","Regional representatives.",40],["Делегати громад із імперативним мандатом.","Community delegates with binding mandates.",85]]},
{a:6,q:["Як ставитися до екоподатків на транспорт?","How to view green taxes on transport?"],o:[["Без екологічних податків.","No ecological taxes.",-85],["Невеликі збори.","Small levies.",-25],["Суттєвий податок на викиди.","A substantial emissions tax.",40],["Обмеження приватного автотранспорту.","Limits on private car use.",85]]},
{a:7,q:["Якими мають бути оборонні союзи?","How should defense alliances be approached?"],o:[["Нейтралітет і позаблоковість.","Neutrality and non-alignment.",-85],["Участь у обмежених альянсах.","Participation in limited alliances.",-25],["Членство у військових союзах.","Membership in military alliances.",45],["Лідерство у військових блоках.","Leadership in military blocs.",85]]},
{a:0,q:["Як ставитися до державної підтримки підприємств у кризу?","How to view state support for firms in a crisis?"],o:[["Широка підтримка та націоналізація.","Broad support and nationalization.",-85],["Цільова підтримка.","Targeted support.",-25],["Кредити на ринкових умовах.","Loans on market terms.",40],["Без втручання: банкрутство є частиною ринку.","No intervention: bankruptcy is part of the market.",85]]},
{a:0,q:["Як ставитися до торгівлі землею?","How to view trade in land?"],o:[["Земля — суспільне достояння, ринку немає.","Land is a public asset; no market.",-85],["Обмежений ринок із квотами.","A limited market with quotas.",-25],["Вільний ринок із реєстром.","A free market with a registry.",40],["Повністю вільний ринок.","A fully free market.",85]]},
{a:1,q:["Чи має держава вводити норми поведінки заради здоров'я?","Should the state set behavior norms for health?"],o:[["Так, обов'язкові норми.","Yes, mandatory norms.",-85],["Сильні рекомендації й регулювання.","Strong recommendations and regulation.",-25],["Інформування без примусу.","Information without coercion.",40],["Повна особиста відповідальність.","Full personal responsibility.",90]]},
{a:2,q:["Як ставитися до розвитку штучного інтелекту?","How to approach the development of artificial intelligence?"],o:[["Суворо обмежувати або забороняти.","Strictly limit or prohibit.",-85],["Обмежувати з обережністю.","Limit with caution.",-25],["Регулювати за рівнем ризику.","Regulate by risk level.",40],["Підтримувати швидкий розвиток.","Support rapid development.",85]]},
