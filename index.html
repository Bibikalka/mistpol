const IL={"Liberalism":["Лібералізм ставить у центр права й свободи особи: свободу слова, віросповідання, власності та політичної участі. Його ключові інститути — верховенство права, поділ влад, вільні вибори та захист меншин від свавілля більшості.<br><br>У різних течіях він по-різному оцінює роль держави в економіці: від ринкового лібералізму до соціального, що допускає перерозподіл. Критики з одного боку кажуть, що він недооцінює спільноту й традицію, з іншого — що мало робить проти нерівності.","Liberalism places individual rights and freedoms at the center: speech, belief, property and political participation. Its key institutions are the rule of law, separation of powers, free elections and protection of minorities from majority abuse.<br><br>Its strands differ on the state's economic role, from market liberalism to social liberalism that accepts redistribution. Critics on one side say it undervalues community and tradition; on the other, that it does too little against inequality."],
"Conservatism":["Консерватизм наголошує на цінності усталених інституцій, традицій і накопиченого досвіду поколінь. Його прихильники віддають перевагу поступовим реформам, бо вважають, що складні соціальні системи важко перебудовувати передбачувано.<br><br>Типові теми: родина, релігія, місцеві спільноти, національна спадщина, обережність у державних витратах. Критики вважають, що така обережність може закріплювати несправедливі порядки; прихильники — що вона захищає від непередбачених наслідків швидких змін.","Conservatism stresses the value of established institutions, traditions and the accumulated experience of generations. Its supporters prefer gradual reform to radical rebuilding, believing complex social systems are hard to change predictably.<br><br>Typical themes are family, religion, local communities, national heritage and caution in public spending. Critics say such caution can entrench unjust arrangements; supporters say it guards against the unforeseen consequences of rapid change."],
"Socialism":["Соціалізм виходить із того, що нерівність у власності на засоби виробництва породжує нерівність у владі й можливостях. Він пропонує суспільну, кооперативну або державну власність на ключові ресурси та планування чи широкий перерозподіл заради рівності й забезпечення базових потреб.<br><br>Течії різняться: від демократичного соціалізму, що діє через вибори, до революційних і державно-планових моделей. Критики вказують на проблеми ефективності, стимулів і концентрації влади; прихильники — на нерівність і вразливість людей на ринку.","Socialism holds that inequality in ownership of the means of production creates inequality in power and opportunity. It proposes social, cooperative or state ownership of key resources and planning or broad redistribution to secure equality and basic needs.<br><br>Strands differ, from democratic socialism acting through elections to revolutionary and state-planned models. Critics point to problems of efficiency, incentives and concentrated power; supporters point to inequality and people's vulnerability in markets."],
"Social democracy":["Соціал-демократія поєднує ринкову економіку з розвиненою соціальною державою: прогресивними податками, загальним доступом до освіти й охорони здоров'я, захистом працівників і сильними профспілками. Вона діє в межах парламентської демократії й відкидає революційний шлях.<br><br>Ідея в тому, щоб зменшити нерівність і ризики, не відмовляючись від приватного підприємництва. Критики зліва вважають її надто поступливою щодо капіталізму, критики справа — надто дорогою й такою, що ослаблює стимули.","Social democracy combines a market economy with a developed welfare state: progressive taxes, universal access to education and healthcare, worker protection and strong unions. It operates within parliamentary democracy and rejects revolution.<br><br>The aim is to reduce inequality and risk without giving up private enterprise. Critics on the left see it as too accommodating to capitalism; critics on the right see it as too costly and weakening to incentives."],
"Libertarianism":["Лібертаріанство виходить з принципу самовласності та неагресії: особа має право на власне тіло, працю й добровільні угоди, а примус виправданий лише для захисту від насильства. Це зазвичай означає мінімальну державу, вільний ринок і широкі особисті свободи.<br><br>Течії різняться від мінархізму до повної відмови від держави. Критики зауважують, що ринок не забезпечує колективні блага й захист вразливих; прихильники — що примус держави зазвичай більший за користь.","Libertarianism rests on self-ownership and non-aggression: a person has rights over their body, labor and voluntary agreements, and coercion is justified only to protect against violence. This usually means a minimal state, free markets and broad personal liberties.<br><br>Strands range from minarchism to a complete rejection of the state. Critics note that markets do not provide collective goods or protect the vulnerable; supporters hold that state coercion usually costs more than it gains."],
"Anarchism":["Анархізм відкидає примусову державну владу й будь-яку незаслужену ієрархію, пропонуючи суспільство добровільних об'єднань, спільнот і кооперації. Існують різні течії: індивідуалістична, мутуалістична, колективістська, комуністична, синдикалістська, а також ринкова.<br><br>Вони розходяться щодо власності й економіки, але сходяться в критиці державного примусу. Критики ставлять під сумнів здатність такого устрою забезпечити безпеку й координацію без інституцій; анархісти відповідають, що ці функції можна виконувати горизонтально.","Anarchism rejects coercive state authority and any unjustified hierarchy, proposing a society of voluntary associations, communities and cooperation. Strands include individualist, mutualist, collectivist, communist, syndicalist and market anarchism.<br><br>They differ on property and the economy but agree in criticizing state coercion. Critics doubt that such an order can provide security and coordination without institutions; anarchists reply that these functions can be performed horizontally."],
"Nationalism":["Націоналізм вважає націю основною політичною спільнотою й джерелом легітимності влади, а право нації на самовизначення — центральним принципом. Він буває різним: громадянським, що спирається на спільні закони й інститути, і етнокультурним, що наголошує на мові, походженні й історії.<br><br>Націоналізм вплинув і на національно-визвольні рухи, і на конфлікти та політику виключення. Тому в оцінці важливо дивитися на конкретну форму й те, як вона ставиться до меншин і сусідів.","Nationalism treats the nation as the basic political community and source of legitimate authority, with national self-determination as a central principle. It takes different forms: civic, resting on shared laws and institutions, and ethnocultural, stressing language, descent and history.<br><br>Nationalism has shaped both national liberation movements and conflicts and politics of exclusion. In assessing it, the specific form matters, along with how it treats minorities and neighbors."],
"Classical liberalism":["Класичний лібералізм сформувався в добу Просвітництва навколо ідей Локка, Сміта й Мілля: природні права, обмежений уряд, вільна торгівля та свобода совісті. Він бачить державу насамперед як гаранта прав і порядку, а економічну свободу — як основу добробуту.<br><br>Сучасне лібертаріанство та частина консервативного лібералізму ведуть від нього своє походження. Критики вказують на питання нерівності та ринкових провалів, які пізніший соціальний лібералізм намагався вирішити.","Classical liberalism took shape in the Enlightenment around the ideas of Locke, Smith and Mill: natural rights, limited government, free trade and freedom of conscience. It sees the state chiefly as guarantor of rights and order, and economic freedom as the basis of prosperity.<br><br>Modern libertarianism and part of conservative liberalism descend from it. Critics point to inequality and market failures, which later social liberalism tried to address."],
"Green social democracy":["Зелена соціал-демократія поєднує соціальну державу з екологічними обмеженнями. Вона підтримує зелені податки, перехід на відновлювані джерела енергії, обмеження забруднення й водночас захист працівників, які втрачають роботу в галузях, що скорочуються.<br><br>Мета — «справедливий перехід»: екологічні цілі без перекладання витрат на найбідніших. Критики зазначають, що це дорого й потребує високих податків; прихильники — що без неї екологічна політика стає соціально несправедливою.","Green social democracy combines the welfare state with ecological limits. It backs green taxes, a shift to renewable energy and pollution limits, while protecting workers who lose jobs in declining industries.<br><br>The aim is a 'just transition': environmental goals without shifting costs onto the poorest. Critics note that it is expensive and needs high taxes; supporters say that without it climate policy becomes socially unjust."],
"Ordoliberalism":["Ордолібералізм — німецька школа (Ойкен, Рьопке, Ерхард), що вважає: ринок потребує сильних правил і незалежного арбітра. Держава має підтримувати конкуренцію, боротися з монополіями, забезпечувати стабільну валюту й чесні правила, але не керувати економікою вручну.<br><br>Звідси ідея «соціальної ринкової економіки», на якій частково вибудовано повоєнну Німеччину. Критики вважають його надто жорстким щодо бюджетної дисципліни; прихильники — що він дає стабільність і запобігає зловживанню владою.","Ordoliberalism is a German school (Eucken, Röpke, Erhard) holding that markets need strong rules and an independent referee. The state should sustain competition, fight monopolies and ensure stable money and fair rules, but not steer the economy by hand.<br><br>Hence the idea of the 'social market economy', on which postwar Germany was partly built. Critics find it too rigid on budget discipline; supporters say it delivers stability and prevents abuse of power."],
"Communism":["Комунізм — ідеологія безкласового суспільства без приватної власності на засоби виробництва, де ресурси розподіляються за потребами. У марксистській традиції до нього веде революційна зміна капіталістичного ладу і перехідний період.<br><br>Історичні державні проєкти, що називали себе комуністичними, у XX столітті поєднували планову економіку з однопартійною владою і супроводжувалися масовими репресіями та економічними кризами, що є предметом критики. Прихильники теорії відрізняють її від цих режимів і наголошують на ідеалі рівності й спільної власності.","Communism is an ideology of a classless society without private ownership of the means of production, where resources are distributed according to need. In the Marxist tradition it is reached through revolutionary change of the capitalist order and a transitional period.<br><br>Historical state projects calling themselves communist combined planned economies with one-party rule in the 20th century and were accompanied by mass repression and economic crises, which is the main subject of criticism. Supporters of the theory distinguish it from those regimes and stress the ideal of equality and common ownership."],
"Fascism":["Фашизм — ультранаціоналістична авторитарна ідеологія, що виникла в міжвоєнній Європі (Італія Муссоліні, нацистська Німеччина як споріднений рух). Вона ставить націю й державу вище за індивіда, обожнює лідера, мілітаризм і єдність під однією партією, відкидає лібералізм, парламентаризм і марксизм.<br><br>Фашистські режими супроводжувалися знищенням політичної опозиції, агресивними війнами й переслідуванням меншин, зокрема Голокостом у нацистській Німеччині. У політології тривають суперечки щодо точного визначення терміна й меж його застосування до пізніших рухів.","Fascism is an ultranationalist authoritarian ideology that arose in interwar Europe (Mussolini's Italy, with Nazi Germany as a related movement). It places nation and state above the individual, glorifies the leader, militarism and unity under one party, and rejects liberalism, parliamentarism and Marxism.<br><br>Fascist regimes were accompanied by the destruction of political opposition, wars of aggression and persecution of minorities, including the Holocaust in Nazi Germany. Political scientists still debate the precise definition of the term and the limits of applying it to later movements."],
"Democratic socialism":["Демократичний соціалізм прагне досягти соціалістичних цілей — суспільного контролю над ключовими галузями, зменшення нерівності й широких соціальних гарантій — демократичним шляхом, через вибори, профспілки й громадянське суспільство. Він відрізняється від державно-планового соціалізму радянського типу тим, що зберігає політичний плюралізм і громадянські свободи.<br><br>Від соціал-демократії його відрізняє ширший акцент на суспільній власності, а не лише на перерозподілі. Критики вказують, що без жорсткого планування цілі важко реалізувати; інші вважають, що ринкові сили обмежують такі проєкти.","Democratic socialism seeks socialist aims, such as social control of key industries, less inequality and broad social guarantees, by democratic means: elections, unions and civil society. It differs from Soviet-style state-planned socialism by keeping political pluralism and civil liberties.<br><br>It differs from social democracy in stressing social ownership, not only redistribution. Critics say that without rigid planning the aims are hard to realize; others hold that market forces constrain such projects."],
"Social liberalism":["Соціальний лібералізм зберігає цінності свободи й верховенства права, але вважає, що справжня свобода потребує базових матеріальних умов: освіти, охорони здоров'я, захисту від бідності. Тому він допускає регульований ринок, прогресивні податки та соціальні програми.<br><br>Його вплив видно у політиці «Нового курсу» та повоєнних системах добробуту. Консервативні критики вважають його надто дорогим; лібертаріанці — що він розширює владу держави; ліві — що він недостатньо глибоко змінює нерівність.","Social liberalism keeps the values of freedom and the rule of law but holds that real freedom needs basic material conditions: education, healthcare and protection from poverty. It therefore accepts a regulated market, progressive taxes and social programs.<br><br>Its influence appears in the New Deal and postwar welfare systems. Conservative critics find it too costly; libertarians say it enlarges state power; the left says it does not change inequality deeply enough."],
"Christian democracy":["Християнська демократія виросла з католицької й протестантської соціальної думки в Європі XX століття. Вона поєднує повагу до родини, спільнот і моральних традицій із ринковою економікою, соціальним партнерством і принципом субсидіарності — вирішенням питань на найнижчому можливому рівні.<br><br>На практиці це давало помірну соціальну державу й підтримку європейської інтеграції у повоєнних партіях Німеччини, Італії та інших країн. Критики зліва вважають її надто консервативною в соціальних питаннях, а справа — надто схильною до державних витрат.","Christian democracy grew out of Catholic and Protestant social thought in 20th-century Europe. It combines respect for family, communities and moral traditions with a market economy, social partnership and subsidiarity: resolving matters at the lowest possible level.<br><br>In practice this produced a moderate welfare state and support for European integration in postwar parties of Germany, Italy and other countries. Critics on the left find it too conservative on social issues; critics on the right find it too prone to public spending."],
"Neoliberalism":["Неолібералізм — ринково орієнтований підхід, що набув впливу з 1970-х: приватизація, дерегуляція, обмеження державних витрат, вільна торгівля й незалежні центральні банки. Він виходить із того, що ринкова конкуренція ефективніше за державне планування розподіляє ресурси.<br><br>Прихильники пов'язують його з економічним зростанням і скороченням бідності; критики — із зростанням нерівності, фінансовою нестабільністю та ослабленням профспілок. Термін часто вживається як полемічний, тому самі прихильники рідко використовують його щодо себе.","Neoliberalism is a market-oriented approach that gained influence from the 1970s: privatization, deregulation, limits on public spending, free trade and independent central banks. It assumes that market competition allocates resources better than state planning.<br><br>Supporters link it with economic growth and reduced poverty; critics link it with rising inequality, financial instability and weakened unions. The term is often used polemically, so supporters seldom apply it to themselves."],
"Anarcho-capitalism":["Анархо-капіталізм поєднує право на приватну власність і вільні угоди з повною відмовою від держави: захист, правосуддя й дороги, на думку його прихильників, можуть надавати приватні компанії й добровільні об'єднання. Серед авторів — Мюррей Ротбард і Девід Фрідман.<br><br>Критики вказують на ризик домінування багатих гравців, складність забезпечення колективних благ і відсутність загальнообов'язкових правил. Прихильники відповідають, що конкуренція служб безпеки й арбітражу дисциплінує їх краще за монополію держави.","Anarcho-capitalism combines the right to private property and free contracts with complete rejection of the state: protection, justice and roads, its supporters say, can be supplied by private firms and voluntary associations. Authors include Murray Rothbard and David Friedman.<br><br>Critics point to the risk of domination by wealthy players, difficulty providing collective goods and the lack of universally binding rules. Supporters reply that competition among security and arbitration services disciplines them better than a state monopoly."],
"Environmentalism":["Екологізм ставить охорону довкілля в центр політики: збереження біорізноманіття, боротьбу зі змінами клімату, зменшення забруднення й сталий розвиток. Він охоплює різні течії — від ринкових інструментів, як-от вуглецеві податки, до критики економічного зростання й споживання.<br><br>Екологісти розходяться щодо ролі технологій (зокрема атомної енергії) та держави. Критики вказують на можливі витрати для економіки й бідніших верств; прихильники — що вартість бездіяльності буде вищою.","Environmentalism puts protection of the environment at the center of politics: conserving biodiversity, fighting climate change, reducing pollution and sustainable development. It spans strands from market tools such as carbon taxes to critiques of economic growth and consumption.<br><br>Environmentalists differ on the role of technology (including nuclear power) and of the state. Critics point to possible costs for the economy and poorer groups; supporters say the cost of inaction will be higher."],
"Populism":["Популізм — спосіб політичної риторики й мобілізації, що протиставляє «чесний народ» «корумпованій еліті» і претендує на вираження загальної волі. Він може бути лівим (акцент на економічній нерівності) або правим (акцент на національній ідентичності чи міграції) і не має єдиної програми.<br><br>Дослідники по-різному оцінюють його: як коректив для інституцій, віддалених від людей, або як загрозу плюралізму й правам меншин, коли лідер говорить від імені «справжнього народу».","Populism is a style of political rhetoric and mobilization that sets the 'honest people' against a 'corrupt elite' and claims to express the general will. It can be left-wing (stressing economic inequality) or right-wing (stressing national identity or migration) and has no single program.<br><br>Scholars assess it differently: as a corrective for institutions distant from people, or as a threat to pluralism and minority rights when a leader speaks in the name of the 'real people'."],
"Liberal democracy":["Ліберальна демократія поєднує вибори й правління більшості із захистом прав людини, верховенством права, незалежним судом, вільною пресою та обмеженням державної влади конституцією. Вона прагне запобігти як свавіллю влади, так і тиранії більшості.<br><br>Сучасні дослідники відзначають виклики: поляризація, недовіра до інституцій, вплив грошей і дезінформація. Прихильники вважають, що її механізми самокорекції сильніші за альтернативи; критики — що вона не завжди вирішує проблеми нерівності й швидкості ухвалення рішень.","Liberal democracy combines elections and majority rule with protection of human rights, the rule of law, an independent judiciary, a free press and constitutional limits on state power. It seeks to prevent both abuse by authorities and tyranny of the majority.<br><br>Modern scholars note its challenges: polarization, distrust of institutions, the influence of money and disinformation. Supporters hold that its self-correcting mechanisms are stronger than the alternatives; critics say it does not always solve inequality or the speed of decision-making."],
"Progressivism":["Прогресивізм розглядає суспільство як те, що можна й варто вдосконалювати через реформи, науку та активну політику держави. Він наголошує на рівності прав, боротьбі з дискримінацією, соціальній справедливості та регулюванні економіки заради громадського блага.<br><br>Історично рух зародився в США наприкінці XIX століття як реакція на корупцію й монополії; сьогодні термін охоплює широкий спектр лівоцентристських поглядів. Критики вважають, що темп змін може бути надто швидким і ігнорувати тривалі традиції; прихильники — що реформи необхідні для усунення стійкої нерівності.","Progressivism sees society as something that can and should be improved through reform, science and active state policy. It stresses equal rights, fighting discrimination, social justice and regulating the economy for the public good.<br><br>The movement arose in the United States in the late 19th century as a reaction to corruption and monopolies; today the term covers a broad range of center-left views. Critics think the pace of change can be too fast and ignore lasting traditions; supporters say reforms are needed to remove persistent inequality."],
"Conservative liberalism":["Консервативний лібералізм поєднує економічну свободу, вільний ринок і верховенство права з повагою до традиційних інституцій, родини та поступового розвитку. Він скептичний щодо швидкого соціального проєктування, але підтримує обмежену державу, що захищає власність і порядок.<br><br>Цей напрям близький до класичного лібералізму в економіці й до консерватизму в культурних питаннях. Критики з обох боків вважають його непослідовним: ліберали — надто традиційним, консерватори — надто ринковим.","Conservative liberalism combines economic freedom, free markets and the rule of law with respect for traditional institutions, family and gradual development. It is skeptical of rapid social engineering but supports a limited state that protects property and order.<br><br>The strand is close to classical liberalism on the economy and to conservatism on cultural questions. Critics on both sides find it inconsistent: liberals think it too traditional, conservatives too market-minded."],
"Keynesianism":["Кейнсіанство — економічне вчення, що пов'язує спади й безробіття з браком сукупного попиту. Держава має підтримувати попит у кризи державними витратами та монетарною політикою, а в період зростання — накопичувати резерви.<br><br>Ідеї Дж. М. Кейнса вплинули на повоєнну економічну політику Заходу. Критики (зокрема монетаристи й австрійська школа) вказують на ризики інфляції та боргу; прихильники — що без стабілізації економіка гірше переносить кризи.","Keynesianism is an economic doctrine linking slumps and unemployment to a shortfall of aggregate demand. The state should support demand in crises through public spending and monetary policy, and build reserves in boom times.<br><br>The ideas of J. M. Keynes shaped postwar Western economic policy. Critics (notably monetarists and the Austrian school) point to risks of inflation and debt; supporters say that without stabilization economies weather crises worse."],
"Marxism":["Марксизм — теорія Карла Маркса й Фрідріха Енгельса, що пояснює історію через боротьбу класів і аналізує капіталізм як систему експлуатації найманої праці. Вона передбачає перехід до безкласового суспільства через зміну власності на засоби виробництва.<br><br>Марксизм вплинув на соціальні науки, профспілки й партії, а також на державні проєкти XX століття. Його критикують за економічні прогнози й політичні наслідки в країнах, де його було втілено; прихильники вказують на цінність його аналізу нерівності й влади капіталу.","Marxism is the theory of Karl Marx and Friedrich Engels that explains history through class struggle and analyzes capitalism as a system of exploiting wage labor. It anticipates a transition to a classless society through changing ownership of the means of production.<br><br>Marxism influenced the social sciences, unions and parties, as well as 20th-century state projects. It is criticized for its economic forecasts and political consequences in countries where it was implemented; supporters point to the value of its analysis of inequality and the power of capital."],
"Monarchism":["Монархізм підтримує монархію як форму державного устрою: влада або символічна роль глави держави передається у спадок. Існують абсолютна, конституційна та парламентська моделі, що дуже різняться за реальною владою монарха.<br><br>Прихильники цінують безперервність традиції, надпартійну фігуру й стабільність; критики вказують на несумісність спадковості з рівністю та демократичною підзвітністю. Сучасні конституційні монархії поєднують цю форму з розвиненою демократією.","Monarchism supports monarchy as a form of government: the authority or symbolic role of head of state passes by inheritance. Absolute, constitutional and parliamentary models exist and differ greatly in the monarch's actual power.<br><br>Supporters value continuity of tradition, a nonpartisan figure and stability; critics note the incompatibility of heredity with equality and democratic accountability. Modern constitutional monarchies combine the form with developed democracy."],
"Republicanism":["Республіканізм (в політичній філософії) наголошує на свободі як відсутності домінування та на громадянській чесноті: громадяни беруть участь у спільних справах, а влада обмежена законами й поділом гілок.<br><br>Традиція сягає Риму та Ренесансу, вплинула на США й Францію. Не слід плутати з назвами партій: тут йдеться про ідею спільної справи (res publica). Критики вважають такі вимоги до громадян надто вимогливими; прихильники — що вони захищають від тиранії.","Republicanism (in political philosophy) stresses freedom as non-domination and civic virtue: citizens take part in common affairs while power is limited by law and separation of branches.<br><br>The tradition reaches back to Rome and the Renaissance and influenced the United States and France. It should not be confused with party names: it concerns the idea of a common cause (res publica). Critics find such demands on citizens too heavy; supporters say they guard against tyranny."],
"Pacifism":["Пацифізм відкидає війну й насильство як засоби розв'язання конфліктів. Він має різні форми: від абсолютної відмови від будь-якого насильства до принципової підтримки переговорів, роззброєння та міжнародного права.<br><br>Історично його підтримували релігійні рухи, а також діячі, як-от Ґанді й Кінг, що застосовували ненасильственний опір. Критики вказують, що відмова від сили може бути небезпечною перед агресором; прихильники — що ненасильственні методи часто ефективніші, ніж видається.","Pacifism rejects war and violence as means of resolving conflict. It takes different forms, from an absolute refusal of any violence to principled support for negotiation, disarmament and international law.<br><br>Historically it was backed by religious movements and by figures such as Gandhi and King who used nonviolent resistance. Critics note that renouncing force can be dangerous facing an aggressor; supporters say nonviolent methods are often more effective than they appear."],
"Feminism":["Фемінізм — це рух і низка теорій про рівність прав і можливостей незалежно від статі та про усунення дискримінації. Він охоплює різні течії: ліберальну, соціалістичну, радикальну, інтерсекційну та інші, які по-різному розставляють акценти.<br><br>Історично його «хвилі» пов'язані з правом голосу, трудовими правами й боротьбою з дискримінацією. Критики оскаржують окремі тези й методи; прихильники вказують на реальні нерівності в оплаті праці, політичному представництві й безпеці.","Feminism is a movement and a range of theories about equal rights and opportunities regardless of sex and about removing discrimination. It includes liberal, socialist, radical, intersectional and other strands that place emphasis differently.<br><br>Its historical 'waves' are tied to the right to vote, labor rights and the fight against discrimination. Critics dispute particular claims and methods; supporters point to real inequalities in pay, political representation and safety."],
"National conservatism":["Національний консерватизм поєднує консервативні цінності (родина, традиція, релігійна спадщина) з наголосом на національному суверенітеті, кордонах і державній політиці, що захищає спільну ідентичність. Він часто скептично ставиться до наднаціональних інституцій і швидкої глобалізації.<br><br>В економіці позиції різняться: від ринкових до протекціоністських. Критики вказують на ризик виключення меншин і торговельні конфлікти; прихильники — на потребу в стабільній спільній ідентичності й підзвітності влади національній спільноті.","National conservatism combines conservative values (family, tradition, religious heritage) with emphasis on national sovereignty, borders and state policy protecting a common identity. It is often skeptical of supranational institutions and rapid globalization.<br><br>On the economy positions vary, from market-oriented to protectionist. Critics point to the risk of excluding minorities and trade conflicts; supporters point to the need for a stable shared identity and for authority accountable to the national community."],
"Paleoconservatism":["Палеоконсерватизм — американська течія, що наголошує на традиції, місцевих спільнотах, релігійній спадщині й обмеженій центральній владі. Він скептично ставиться до інтервенціонізму, масової імміграції та глобальної торгівлі, що, на його думку, руйнують спільноти.<br><br>Він виник як критика неоконсерватизму. Критики вважають його надто закритим і ностальгійним; прихильники — що він відстоює реальні інтереси звичайних людей і стриманість держави.","Paleoconservatism is an American strand stressing tradition, local communities, religious heritage and limited central power. It is skeptical of interventionism, mass immigration and global trade, which it holds erode communities.<br><br>It arose as a critique of neoconservatism. Critics find it too closed and nostalgic; supporters say it defends the real interests of ordinary people and restraint by the state."],
"Syndicalist anarchism":["Сіндикалістський анархізм (анархо-синдикалізм) вважає профспілки основою нового суспільства: робітники керують підприємствами напряму, а галузі координуються федераціями. Держава й капіталіст мають бути замінені самоврядуванням працівників.<br><br>Рух був впливовим в Іспанії (CNT) та інших країнах на початку XX століття. Критики вказують на складність координації без центру й на конфлікти інтересів галузей; прихильники — на його ідею демократії на робочому місці.","Syndicalist anarchism (anarcho-syndicalism) treats unions as the basis of a new society: workers run enterprises directly and industries coordinate through federations. The state and the capitalist are to be replaced by workers' self-government.<br><br>The movement was influential in Spain (the CNT) and other countries in the early 20th century. Critics point to the difficulty of coordination without a center and to conflicts of interest between industries; supporters point to its idea of workplace democracy."],
"Mutualism":["Мутуалізм, пов'язаний з П'єром-Жозефом Прудоном, пропонує економіку вільних обмінів між працівниками й виробниками без експлуатації: кооперативи, взаємний кредит і власність, що спирається на власну працю.<br><br>Він займає проміжне місце між ринком і соціалізмом: зберігає обмін і конкуренцію, але відкидає найману працю на великих власників і ренту. Критики сумніваються в стійкості такої системи; прихильники бачать у ній шлях до справедливого ринку.","Mutualism, associated with Pierre-Joseph Proudhon, proposes an economy of free exchange among workers and producers without exploitation: cooperatives, mutual credit and property resting on one's own labor.<br><br>It occupies a middle ground between market and socialism: it keeps exchange and competition but rejects wage labor under large owners and rent. Critics doubt such a system's stability; supporters see in it a path to a fair market."],
"Civic nationalism":["Громадянський націоналізм визначає націю як спільноту громадян, об'єднаних законами, інститутами та політичною лояльністю, а не походженням. Членом нації може стати кожен, хто поділяє її громадянські цінності.<br><br>Цю модель часто пов'язують із Францією, США та західними демократіями. Критики вказують, що вона може недооцінювати роль мови й культури; прихильники — що вона дає інклюзивну основу єдності й уникає етнічної виключності.","Civic nationalism defines the nation as a community of citizens united by laws, institutions and political loyalty rather than descent. Anyone who shares its civic values can become a member of the nation.<br><br>The model is often linked with France, the United States and Western democracies. Critics say it may underrate the role of language and culture; supporters say it offers an inclusive basis of unity and avoids ethnic exclusivity."],
"Cosmopolitanism":["Космополітизм виходить із ідеї, що всі люди є членами єдиної моральної спільноти, а їхні права й гідність не залежать від кордонів. Він підтримує міжнародне право, права людини та відкритість до інших культур.<br><br>Існують політичний (глобальне врядування), моральний і культурний варіанти. Критики вважають, що він ослаблює демократичну підзвітність і місцеві зв'язки; прихильники — що глобальні проблеми потребують спільних відповідей.","Cosmopolitanism holds that all people are members of a single moral community and that their rights and dignity do not depend on borders. It supports international law, human rights and openness to other cultures.<br><br>Political (global governance), moral and cultural variants exist. Critics think it weakens democratic accountability and local ties; supporters say global problems need shared responses."],
"Utilitarianism":["Утилітаризм оцінює політику за її наслідками: правильним є те, що забезпечує найбільше добробуту для найбільшої кількості людей. Його засновниками вважають Бентама й Мілля, а сучасними прихильниками є, зокрема, Пітер Сінгер.<br><br>Він впливає на економічну політику, охорону здоров'я та етику допомоги. Критики вказують, що він може виправдовувати ущемлення прав меншин заради загальної вигоди; прихильники — що він дає прозорий і неупереджений критерій рішень.","Utilitarianism judges policy by its consequences: the right course is the one that yields the most well-being for the greatest number of people. Its founders are considered Bentham and Mill, and modern supporters include Peter Singer.<br><br>It influences economic policy, healthcare and the ethics of aid. Critics note that it can justify infringing minority rights for general benefit; supporters say it provides a transparent and impartial criterion for decisions."],
"Communitarianism":["Комунітаризм наголошує, що особа формується спільнотами, і критикує надмірний індивідуалізм. Він підкреслює спільні цінності, громадянську участь, місцеві об'єднання та обов'язки перед спільнотою поряд із правами.<br><br>Серед мислителів — Макінтайр, Сендел, Волцер. Критики вважають, що він може тиснути на меншини й нонконформістів; прихильники — що без спільнот права стають абстрактними.","Communitarianism stresses that persons are formed by communities and criticizes excessive individualism. It emphasizes shared values, civic participation, local associations and duties to the community alongside rights.<br><br>Thinkers include MacIntyre, Sandel and Walzer. Critics say it can pressure minorities and nonconformists; supporters say that without communities rights become abstract."],
"Federalism":["Федералізм розподіляє владу між загальнонаціональним рівнем і регіонами (штатами, землями, кантонами), кожен із яких має власні гарантовані повноваження. Це дає змогу поєднати єдність держави з різноманіттям місцевих рішень.<br><br>Прикладами є США, Німеччина, Швейцарія. Критики вказують на складність координації й нерівність між регіонами; прихильники — на кращий облік місцевих потреб і стримування надмірної централізації.","Federalism divides power between a national level and regions (states, lands, cantons), each with its own guaranteed powers. This combines the unity of the state with diversity of local decisions.<br><br>Examples include the United States, Germany and Switzerland. Critics point to coordination difficulty and inequality among regions; supporters point to better accounting for local needs and a check on excessive centralization."],
"Realism":["Реалізм у міжнародних відносинах вважає, що держави діють у системі без вищої влади й передусім дбають про безпеку та власні інтереси. Мораль і міжнародне право відіграють обмежену роль порівняно з балансом сил.<br><br>Серед відомих авторів — Моргентау, Кеннан, Кіссінджер. Критики вважають такий підхід надто цинічним і таким, що недооцінює роль інституцій і цінностей; прихильники — що він реалістично описує поведінку держав.","Realism in international relations holds that states act in a system with no higher authority and care first of all about security and their own interests. Morality and international law play a limited role compared with the balance of power.<br><br>Well-known authors include Morgenthau, Kennan and Kissinger. Critics find the approach too cynical and one that underrates institutions and values; supporters say it realistically describes state behavior."],
"Third Way":["«Третій шлях» — центристський підхід 1990-х (Блер, Клінтон, Шредер), що поєднує ринкову економіку з соціальними гарантіями, наголошуючи на освіті, праці та відповідальності. Він прагне вийти за межі протистояння лівих і правих.<br><br>Критики зліва вважають його надто близьким до неолібералізму, справа — недостатньо ринковим. Прихильники вказують на прагматичне поєднання зростання й соціальної політики.","The 'Third Way' is a centrist approach of the 1990s (Blair, Clinton, Schröder) combining a market economy with social guarantees and stressing education, work and responsibility. It tries to move beyond the left–right confrontation.<br><br>Critics on the left find it too close to neoliberalism, on the right not market-minded enough. Supporters point to a pragmatic combination of growth and social policy."],
"Corporatism":["Корпоративізм організовує суспільство через великі професійні й галузеві групи (союзи працівників і роботодавців, асоціації), які представляють інтереси перед державою та між собою. У ліберальній формі це «неокорпоративізм» соціального партнерства, у авторитарній — державний контроль над цими групами.<br><br>Критики вказують на ризик обмеження конкуренції й виключення неорганізованих груп; прихильники — на стабільність і узгодження інтересів.","Corporatism organizes society through large occupational and sectoral groups (unions of workers and employers, associations) that represent interests before the state and among themselves. In a liberal form this is the 'neo-corporatism' of social partnership, in an authoritarian one, state control over these groups.<br><br>Critics point to the risk of limiting competition and excluding unorganized groups; supporters point to stability and reconciling interests."],
"Distributism":["Дистрибутизм, поширений у католицькій соціальній думці (Честертон, Белок), виступає за широке розосередження власності: якомога більше сімей мають володіти землею, майстернями й малими підприємствами. Він критикує і концентрацію капіталу, і державний соціалізм.<br><br>Принцип субсидіарності передбачає вирішення питань на найнижчому рівні. Критики вважають модель непрактичною для сучасної економіки; прихильники — що вона зберігає незалежність і стабільність громад.","Distributism, common in Catholic social thought (Chesterton, Belloc), argues for wide distribution of property: as many families as possible should own land, workshops and small businesses. It criticizes both the concentration of capital and state socialism.<br><br>The principle of subsidiarity calls for resolving matters at the lowest level. Critics find the model impractical for a modern economy; supporters say it preserves the independence and stability of communities."],
"Libertarian municipalism":["Лібертарний муніципалізм Мюррея Букчіна пропонує пряму демократію місцевих зборів і конфедерацію таких громад замість централізованої держави. Економіка має бути муніципалізована й орієнтована на екологічну рівновагу.<br><br>Він пов'язаний із соціальною екологією й вплинув на деякі сучасні експерименти самоврядування. Критики вважають, що малі громади не здатні вирішувати великі економічні й безпекові завдання; прихильники — що це шлях до реальної участі людей у владі.","Murray Bookchin's libertarian municipalism proposes direct democracy through local assemblies and a confederation of such communities in place of a centralized state. The economy is to be municipalized and oriented to ecological balance.<br><br>It is tied to social ecology and has influenced some modern self-government experiments. Critics hold that small communities cannot handle large economic and security tasks; supporters say it is a route to real popular participation in power."],
"Geolibertarianism":["Геолібертаріанство поєднує вільний ринок і особисту свободу з ідеєю, що земля й природні ресурси належать усім, а власники мають платити суспільству ренту за їх використання. Ця ідея пов'язана з Генрі Джорджем.<br><br>Прибуток від ренти може фінансувати державні послуги замість інших податків. Критики вказують на труднощі оцінки земельної ренти; прихильники — що податок на землю менше спотворює економіку й обмежує спекуляцію.","Geolibertarianism combines free markets and personal liberty with the idea that land and natural resources belong to everyone, with owners paying society rent for their use. The idea is linked to Henry George.<br><br>Revenue from the rent can fund public services in place of other taxes. Critics point to the difficulty of assessing land rent; supporters say a land tax distorts the economy less and curbs speculation."],
"Anarcho-communism":["Анархо-комунізм (Кропоткін, Малатеста) поєднує відмову від держави зі спільною власністю на засоби виробництва і розподілом «кожному за потребами». Суспільство організується добровільними комунами й федераціями, а рішення ухвалюються безпосередньо.<br><br>Кропоткін обґрунтовував це ідеєю взаємодопомоги як чинника еволюції. Критики вважають таку модель утопічною, бо вона потребує високого рівня добровільної співпраці; прихильники — що історичні приклади самоврядування показують її здійсненність.","Anarcho-communism (Kropotkin, Malatesta) combines rejection of the state with common ownership of the means of production and distribution 'to each according to need'. Society is organized by voluntary communes and federations, with decisions made directly.<br><br>Kropotkin grounded it in the idea of mutual aid as a factor of evolution. Critics find the model utopian because it requires a high level of voluntary cooperation; supporters say historical examples of self-government show it is feasible."],
"Libertarian socialism":["Лібертарний соціалізм — широка течія, що поєднує соціалістичну ідею спільної власності й рівності з критикою централізованої держави й ієрархій. До неї належать анархізм, лібертарний марксизм, рада-комунізм і подібні напрями.<br><br>Акцент робиться на робітничому самоврядуванні та прямій демократії. Серед відомих прихильників — Ноам Чомскі. Критики вказують на складність поєднання масштабних економічних завдань із децентралізацією; прихильники — на можливість поєднати рівність і свободу.","Libertarian socialism is a broad current combining the socialist idea of common ownership and equality with criticism of the centralized state and hierarchies. It includes anarchism, libertarian Marxism, council communism and similar strands.<br><br>The emphasis is on workers' self-management and direct democracy. Well-known supporters include Noam Chomsky. Critics point to the difficulty of reconciling large-scale economic tasks with decentralization; supporters point to the possibility of combining equality and freedom."],
"Objectivism":["Об'єктивізм — філософська система Айн Ренд, що виходить з раціонального егоїзму: кожна людина має жити заради власного щастя, не жертвуючи собою заради інших і не вимагаючи жертв від інших. Політично це веде до захисту обмеженого уряду й капіталізму laissez-faire.<br><br>Вплив системи помітний у лібертаріанських колах. Критики вважають її надто індивідуалістичною та такою, що ігнорує взаємозалежність людей; прихильники — що вона дає послідовне обґрунтування свободи й відповідальності.","Objectivism is Ayn Rand's philosophical system, based on rational egoism: each person should live for their own happiness, neither sacrificing themselves for others nor demanding sacrifices from others. Politically this leads to a defense of limited government and laissez-faire capitalism.<br><br>The system's influence is notable in libertarian circles. Critics find it too individualistic and ignoring people's interdependence; supporters say it gives a consistent grounding of freedom and responsibility."],
"Minarchism":["Мінархізм підтримує «мінімальну державу», обмежену функціями захисту від насильства, забезпечення договорів і правосуддя. Усе інше, зокрема освіта, охорона здоров'я й соціальне забезпечення, має виконуватися приватно чи добровільно.<br><br>Філософське обґрунтування дав, зокрема, Роберт Нозік. Анархо-капіталісти вважають навіть таку державу надмірною, а критики з інших позицій — що вона не гарантує базових потреб і колективних благ.","Minarchism supports a 'minimal state' limited to protection from violence, enforcing contracts and providing justice. Everything else, including education, healthcare and social security, should be provided privately or voluntarily.<br><br>Philosophical grounding was given by Robert Nozick, among others. Anarcho-capitalists regard even such a state as excessive, while critics from other positions say it does not guarantee basic needs and collective goods."],
"Neoconservatism":["Неоконсерватизм виник у США в 1960–70-х серед колишніх лівих інтелектуалів. Він поєднує консервативні соціальні акценти з активною зовнішньою політикою, що підтримує поширення демократії та силову відповідь на загрози.<br><br>Особливо помітним був у політиці США на початку 2000-х. Критики вважають такий підхід авантюрним і дорогим, а прихильники — що пасивність породжує більші загрози і що підтримка демократії відповідає інтересам безпеки.","Neoconservatism arose in the United States in the 1960s–70s among former left-wing intellectuals. It combines conservative social emphases with an active foreign policy that supports spreading democracy and a forceful response to threats.<br><br>It was especially prominent in US policy in the early 2000s. Critics find the approach adventurist and costly, while supporters say passivity creates greater threats and that supporting democracy serves security interests."],
"Isolationism":["Ізоляціонізм виступає за обмеження втручання держави в міжнародні справи, військові союзи та зарубіжні конфлікти, зберігаючи, як правило, торгівлю й культурні контакти. Класичним прикладом вважають зовнішню політику США до Другої світової.<br><br>Прихильники наголошують на економії ресурсів і уникненні війн, критики — що в взаємозалежному світі загрози важко ізолювати і що відсторення ослаблює вплив і безпеку.","Isolationism favors limiting a state's involvement in international affairs, military alliances and foreign conflicts, usually while keeping trade and cultural contacts. US foreign policy before World War II is often cited as the classic example.<br><br>Supporters stress saving resources and avoiding wars; critics say that in an interdependent world threats are hard to isolate and that withdrawal weakens influence and security."],
"Deep ecology":["Глибока екологія (Арне Несс) стверджує, що всі форми життя мають самоцінність, незалежну від користі для людей. Вона закликає до радикального скорочення людського впливу на природу, спрощення способу життя та захисту диких територій.<br><br>Критики вважають її надто різкою щодо людських потреб і такою, що може ставити природу вище за людей; прихильники — що без зміни самого ставлення до природи екологічні кризи неможливо подолати.","Deep ecology (Arne Næss) holds that all forms of life have intrinsic value independent of their usefulness to humans. It calls for radically reducing human impact on nature, simplifying ways of life and protecting wild areas.<br><br>Critics find it too harsh on human needs and one that may place nature above people; supporters say that without changing attitudes to nature itself, ecological crises cannot be overcome."],
"Eco-socialism":["Екосоціалізм поєднує соціалістичну критику капіталізму з екологічною: невпинне зростання й прибуток, на думку його прихильників, несумісні зі збереженням довкілля. Він пропонує суспільний контроль над виробництвом, планування й обмеження споживання.<br><br>Критики вказують на економічні ризики й труднощі планування; прихильники — що лише зміна власності й цілей економіки здатна поєднати соціальну справедливість і екологічну стійкість.","Eco-socialism combines the socialist critique of capitalism with an ecological one: ceaseless growth and profit, its supporters hold, are incompatible with preserving the environment. It proposes social control over production, planning and limits on consumption.<br><br>Critics point to economic risks and the difficulty of planning; supporters say only a change in ownership and the aims of the economy can combine social justice and ecological sustainability."],
"Transhumanism":["Трансгуманізм підтримує використання технологій — біотехнологій, ШІ, нейроінтерфейсів — для покращення здібностей людини, подовження життя та подолання біологічних обмежень. Політично він зазвичай виступає за свободу наукових досліджень і вибору.<br><br>Критики вказують на ризики нерівності доступу, етичні питання й непередбачені наслідки; прихильники вважають, що відмова від таких технологій означала би відмову від допомоги людям.","Transhumanism supports using technology, such as biotechnology, AI and neural interfaces, to enhance human abilities, extend life and overcome biological limits. Politically it usually favors freedom of research and choice.<br><br>Critics point to risks of unequal access, ethical questions and unforeseen consequences; supporters hold that refusing such technologies would mean refusing to help people."],
"Humanism":["Гуманізм ставить у центр гідність і добробут людини, спираючись на розум, науку й етику, що не залежать від релігійних авторитетів. Він підтримує права людини, освіту, свободу совісті та відповідальність людей за спільне майбутнє.<br><br>Існують релігійні й світські гуманістичні напрями. Критики вважають його надто людиноцентричним (екологи) або надто секулярним (релігійні консерватори); прихильники — що він дає спільну етичну основу для різних культур.","Humanism puts human dignity and well-being at the center, relying on reason, science and an ethics independent of religious authority. It supports human rights, education, freedom of conscience and people's responsibility for a shared future.<br><br>Religious and secular humanist strands exist. Critics find it too human-centered (ecologists) or too secular (religious conservatives); supporters say it gives a common ethical basis for different cultures."],
"Meritocracy":["Меритократія — ідея, що влада, посади й винагороди мають розподілятися за заслугами: здібностями, знаннями та зусиллями, а не за походженням чи зв'язками. Вона лежить в основі конкурсів, іспитів і професійних кар'єр.<br><br>Критики вказують, що «заслуги» залежать від стартових умов і що меритократія може виправдовувати нерівність; прихильники — що вона справедливіша й ефективніша за привілеї за походженням.","Meritocracy is the idea that power, posts and rewards should be allocated by merit: ability, knowledge and effort, not by descent or connections. It underlies competitions, examinations and professional careers.<br><br>Critics note that 'merit' depends on starting conditions and that meritocracy can justify inequality; supporters say it is fairer and more efficient than privilege by birth."],
"Confederalism":["Конфедералізм — союз суверенних або автономних одиниць, що делегують спільному центру лише обмежені повноваження, зазвичай оборону й зовнішні зносини. Рішення ухвалюються за згодою складових, які часто мають право вийти зі союзу.<br><br>Прикладами були Швейцарська конфедерація в минулому й ранні США. Критики вважають такий устрій нестабільним і неефективним; прихильники — що він найкраще захищає місцеву автономію й різноманіття.","Confederalism is a union of sovereign or autonomous units that delegate only limited powers to a shared center, usually defense and foreign relations. Decisions are made by consent of the components, which often have the right to leave the union.<br><br>Examples include the Swiss Confederation in the past and the early United States. Critics find such an order unstable and inefficient; supporters say it best protects local autonomy and diversity."]};
/* ===== State ===== */
let L=localStorage.getItem?.("l")||"ua",ans=[],step=-1,pair=0,flt="all";
const $=s=>document.querySelector(s),t=k=>T[L][k],li=a=>a[L=="ua"?0:1];
const PAIRS=[[0,1],[2,4],[3,6],[5,7]];
/* ===== Scoring: user vector = chosen value per axis (averaged if several questions share axis) ===== */
function score(){const s=Array(8).fill(0),n=Array(8).fill(0);ans.forEach((o,i)=>{const q=Q[i];s[q.a]+=q.o[o][2];n[q.a]++});return s.map((v,i)=>n[i]?Math.round(v/n[i]):0)}
const dist=(a,b)=>Math.hypot(...a.map((v,i)=>v-b[i]));
const pct=d=>Math.max(0,Math.round(100-d/4.5));
function render(){const A=$("#app");$("#lg").textContent=L=="ua"?"EN":"UA";$("#br").textContent=t("title");document.documentElement.lang=L=="ua"?"uk":"en";
if(step<0)A.innerHTML=`<div class=card><h1>${t("title")}</h1><p>${t("intro")}</p><button class=p onclick="step=0;render()">${t("start")}</button></div>`;
else if(step<Q.length){const q=Q[step];A.innerHTML=`<div class=card><div class=bar><i style="width:${step/Q.length*100}%"></i></div><div class=mu>${t("q")} ${step+1}/${Q.length}</div><h2>${li(q.q)}</h2>${q.o.map((o,i)=>`<button class=opt onclick="pick(${i})">${li(o)}</button>`).join("")}${step?`<button onclick="step--;ans.pop();render()">← ${t("back")}</button>`:""}</div>`}
else results(A)}
function pick(i){ans[step]=i;step++;location.hash="r="+ans.join("");render()}
function results(A){const u=score(),ranked=F.map(f=>({f,d:dist(u,f[3])})).sort((a,b)=>a.d-b.d);
const id=ID.map(x=>({x,d:dist(u,x[2])})).sort((a,b)=>a.d-b.d)[0].x;
const ext=u.map((v,i)=>[i,v]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,2).map(([i,v])=>li(AX[i][v>=0?1:0])+" ("+v+")").join(", ");
const fig=r=>`<div class=ax><b>${li(r.f)}</b> — ${pct(r.d)}% ${t("match")}<div class=mu>${r.f[L=="ua"?4:5]||(BIO[r.f[1]]||[])[L=="ua"?0:1]||""}</div>${QT[r.f[1]]?`<div class=mu><i>«${QT[r.f[1]][L=="ua"?0:1]}»</i></div>`:""}</div>`;
A.innerHTML=`<div class=card><h2>${t("res")}</h2><div class=mu>${t("ideo")}</div><h1>${li(id)}</h1><p>${id[L=="ua"?3:4]}</p>${IL[id[1]]?`<p>${IL[id[1]][L=="ua"?0:1]}</p>`:""}<div class=mu>${t("strong")}: ${ext}</div></div>
<div class=card><h3>${t("axes")}</h3>${u.map((v,i)=>`<div class=ax><div class=l><span>${li(AX[i][0])}</span><span>${li(AX[i][1])}</span></div><div class=t><b style="left:${(v+100)/2}%"></b></div></div>`).join("")}</div>
<div class=card><h3>${t("plot")}</h3><div class=row>${PAIRS.map((p,i)=>`<button class="${i==pair?"p":""}" onclick="vb=[0,0,360,360];pair=${i};render()">${li(AX[p[0]][1]).split("/")[0]} × ${li(AX[p[1]][1]).split("/")[0]}</button>`).join("")}</div><div class=row style="margin:8px 0">${["all","p","e","r","a"].map(k=>`<button class="${k==flt?"p":""}" onclick="vb=[0,0,360,360];flt='${k}';render()">${k=="all"?t("all"):({p:["Філософи","Philosophers"],e:["Економісти","Economists"],r:["Правителі","Rulers"],a:["Діячі","Activists"]})[k][L=="ua"?0:1]}</button>`).join("")}</div><div class=row style="margin-bottom:8px"><button onclick="zm(.7)">＋</button><button onclick="zm(1/.7)">−</button><button onclick="vb=[0,0,360,360];setvb()">⟲</button><span class=mu>${L=="ua"?"Коліщатко, перетягування, щипок. Наближайте, щоб побачити більше підписів; назву будь-якої точки видно при наведенні.":"Wheel, drag, pinch. Zoom in to reveal more labels; hover any dot for its name."}</span></div><div class=sc>${plot(u)}</div></div>
<div class=card><h3>${t("top")}</h3>${ranked.slice(0,5).map(fig).join("")}<h3>${t("low")}</h3>${ranked.slice(-3).reverse().map(fig).join("")}</div>
<div class=row><button class=p onclick="share()" id=sh>${t("share")}</button><button onclick="dl()">${t("dl")}</button><button onclick="ans=[];step=0;location.hash='';render()">${t("again")}</button></div>`}
/* ===== SVG scatter: x,y = axes of the chosen pair ===== */
function plot(u){const [x,y]=PAIRS[pair],S=360,P=34,sx=v=>P+(v+100)/200*(S-2*P),sy=v=>S-P-(v+100)/200*(S-2*P);
let s=`<svg id=pl viewBox="${vb.join(" ")}" width="${S}" style="width:100%;max-width:520px;touch-action:none;cursor:grab;user-select:none"><rect x=${P} y=${P} width=${S-2*P} height=${S-2*P} fill=none stroke="var(--bd)"/><line x1=${sx(0)} x2=${sx(0)} y1=${P} y2=${S-P} stroke="var(--bd)"/><line y1=${sy(0)} y2=${sy(0)} x1=${P} x2=${S-P} stroke="var(--bd)"/>
<text x=${S/2} y=${S-8} text-anchor=middle font-size=10 fill="var(--mu)">${li(AX[x][0])} ← → ${li(AX[x][1])}</text>
<text transform="translate(10 ${S/2}) rotate(-90)" text-anchor=middle font-size=10 fill="var(--mu)">${li(AX[y][0])} ← → ${li(AX[y][1])}</text>`;
s+="<g id=lb>"+lab()+"</g>";
return s+`<circle cx=${sx(u[x])} cy=${sy(u[y])} r=7 fill="var(--ac)" stroke="#fff" stroke-width=2><title>${t("you")}</title></circle><text x=${sx(u[x])+9} y=${sy(u[y])+4} font-size=11 font-weight=700 fill="var(--ac)">${t("you")}</text></svg>`}
function share(){navigator.clipboard?.writeText(location.href).catch(()=>{});$("#sh").textContent=t("copied")}
function dl(){const u=score(),b=new Blob([JSON.stringify({axes:u,answers:ans},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="compass.json";a.click()}
/* ===== Plot zoom/pan: manipulates the SVG viewBox directly, so no re-render ===== */
let vb=[0,0,360,360];
const setvb=()=>{const s=$("#pl");if(!s)return;s.setAttribute("viewBox",vb.join(" "));$("#lb").innerHTML=lab()};
/* Declutter: dots/fonts keep a constant on-screen size (k = zoom factor); each label tries 4 positions (right, left, above, below) and is skipped if all collide. Zooming in frees space, so more labels appear. */
function lab(){const [x,y]=PAIRS[pair],S=360,P=34,k=vb[2]/360,fs=7*k,sx=v=>P+(v+100)/200*(S-2*P),sy=v=>S-P-(v+100)/200*(S-2*P),u=score(),
 pts=F.filter(f=>flt=="all"||f[2]==flt).map(f=>({f,X:sx(f[3][x]),Y:sy(f[3][y])})),
 box=[[sx(u[x])-8,sy(u[y])-8,16,16]],hit=(a,b)=>a[0]<b[0]+b[2]&&b[0]<a[0]+a[2]&&a[1]<b[1]+b[3]&&b[1]<a[1]+a[3];
 let out=pts.map(p=>`<circle cx=${p.X} cy=${p.Y} r=${3.5*k} fill="var(--mu)" opacity=.75><title>${li(p.f)}</title></circle>`).join("");
 pts.forEach(p=>box.push([p.X-2*k,p.Y-2*k,4*k,4*k]));
 pts.forEach(p=>{if(p.X<vb[0]||p.X>vb[0]+vb[2]||p.Y<vb[1]||p.Y>vb[1]+vb[3])return;
  const n=li(p.f).split(" ").pop(),w=n.length*fs*.6,h=fs,c=[[p.X+4*k,p.Y-h/2],[p.X-4*k-w,p.Y-h/2],[p.X-w/2,p.Y-4*k-h],[p.X-w/2,p.Y+4*k]];
  for(const [a,b] of c){const r=[a,b,w,h];if(!box.some(q=>hit(r,q))){box.push(r);out+=`<text x=${a} y=${b+h*.8} font-size=${fs} fill="var(--mu)">${n}</text>`;break}}});
 return out}
function clampvb(){vb[0]=Math.max(0,Math.min(360-vb[2],vb[0]));vb[1]=Math.max(0,Math.min(360-vb[3],vb[1]))}
/* f<1 zooms in; px,py = focus point as a fraction of the view */
function zm(f,px=.5,py=.5){const w=Math.min(360,Math.max(30,vb[2]*f));vb=[vb[0]+(vb[2]-w)*px,vb[1]+(vb[3]-w)*py,w,w];clampvb();setvb()}
const A0=$("#app"),pts=new Map();let pd=0;
const pdist=()=>{const a=[...pts.values()];return a.length>1?Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]):0};
A0.addEventListener("wheel",e=>{const s=e.target.closest("#pl");if(!s)return;e.preventDefault();const r=s.getBoundingClientRect();zm(e.deltaY<0?.8:1.25,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
A0.addEventListener("pointerdown",e=>{if(!e.target.closest("#pl"))return;pts.set(e.pointerId,[e.clientX,e.clientY]);pd=pdist()});
A0.addEventListener("pointermove",e=>{const s=$("#pl");if(!s||!pts.has(e.pointerId))return;const o=pts.get(e.pointerId),r=s.getBoundingClientRect();pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size>1){const d=pdist();if(pd&&d)zm(pd/d);pd=d}else{vb[0]-=(e.clientX-o[0])/r.width*vb[2];vb[1]-=(e.clientY-o[1])/r.height*vb[3];clampvb();setvb()}});
["pointerup","pointercancel","pointerleave"].forEach(n=>A0.addEventListener(n,e=>{pts.delete(e.pointerId);pd=0}));
/* ===== Wiring ===== */
$("#lg").onclick=()=>{L=L=="ua"?"en":"ua";try{localStorage.setItem("l",L)}catch(e){}render()}; /* language switch keeps progress */
$("#th").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=="dark"?"light":"dark"};
const m=location.hash.match(/r=(\d+)/);if(m&&m[1].length==Q.length){ans=[...m[1]].map(Number);step=Q.length}
render();
</script></body></html>
